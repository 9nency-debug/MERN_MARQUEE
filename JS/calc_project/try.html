<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simple Calculator</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #e9ecef;
    }

    .calculator {
        background-color: #2b2d42;
        border-radius: 15px;
        width: 320px;
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
    }

    #display {
        width: 100%;
        height: 70px;
        background-color: #edf2f4;
        border: none;
        border-radius: 8px;
        font-size: 40px;
        text-align: right;
        padding: 10px;
        margin-bottom: 20px;
        color: #2b2d42;
        outline: none;
    }

    .buttons-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
    }
    
    .btn {
        background-color: #8d99ae;
        color: white;
        border-radius: 10px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 24px;
        font-weight: bold;
        height: 60px;
        cursor: pointer;
        transition: 0.2s;
        user-select: none;
    }

     /* .btn:hover {
        background-color: #a4b0c2;
    }  */

    .btn:active {
        transform: scale(0.95);
    }
    .operator {
        background-color: #ff9f1c;
    }
    .operator:hover {
        background-color: #ffb042;
    }

    .clear {
        background-color: #ef233c;
    }
    .clear:hover {
        background-color: #f24b5f;
    }

    .equal {
        background-color: #2ec4b6; 
        grid-column: 4;           
        grid-row: 2 / span 4;
    }
    .equal:hover {
        background-color: #4bd2c6;
    }
</style>
</head>
<body>

<div class="calculator">
    <input type="text" id="display" value="0" disabled>

    <div class="buttons-grid">
        <div class="btn operator">+</div>
        <div class="btn operator">-</div>
        <div class="btn operator">*</div>
        <div class="btn operator">/</div>


        <div class="btn">7</div>
        <div class="btn">8</div>
        <div class="btn">9</div>
        <div class="btn equal">=</div> <!-- Spans downward -->

        
        <div class="btn">4</div>
        <div class="btn">5</div>
        <div class="btn">6</div>

        <!-- Row 4 -->
        <div class="btn">1</div>
        <div class="btn">2</div>
        <div class="btn">3</div>

        <!-- Row 5 -->
        <div class="btn">0</div>
        <div class="btn">.</div>
        <div class="btn clear">AC</div>
    </div>
</div>

<script>
    let buttons = document.querySelectorAll(".btn");
    let display = document.querySelector("#display");
    let total = "";


    buttons.forEach((button) => {
        button.addEventListener("click", () => {
            let value = button.innerText;

            if (value === "AC") {
                total = "";
                display.value = "0";
            } 
            else if (value === "=") {
                try {
                    total = eval(total).toString(); 
                    display.value = total;
                } catch (error) {
                    display.value = "Error";
                    total = "";
                }
            } else {
                total = total + value;
                display.value = total;
            }

            console.log("Current total:", total);
        });
    });


    
</script>

</body>
</html>
